schema: forge-idle-prompts/2
classifier_version: 2
supported:
  codex_versions: ["0.145.0", "0.146.0", "0.146.1", "0.147.0", "0.148.0"]
  locales: ["en-US"]
codex-a: &codex
  family: codex
  idle_prompt_anchor: '^\s{2}gpt-[0-9][\w.\-]*(?:\s+\w+(?:\s+fast)?)?\s+·\s+(?:\S.*?)?(?:\s+·\s+\S.*)?$'
  active_work_marker: '^•\s+Working\s+\(\d+'
  past_work_marker: '^─\s+Worked\s+for\s+\d+'
  approval_prompt: '(?ms)^(?:⚠\s+)?(?:Would you like to run the following command\?|Do you want to allow .+?)\s*$[\s\S]{0,1200}?^\s*[›❯>]?\s*1\.\s+(?:Yes|Allow|Run)(?:,|\s|$)'
codex-b: *codex
claude-opus: &claude
  family: claude
  idle_prompt_anchor: '^  \[(?:Opus|Sonnet|Haiku|Fable) [0-9.]+(?: \(1M context\))?\] ctx: \d+k? \(\d+%\)'
  active_work_marker: '^[✀-➿] \w+… \(\d+s'
  past_work_marker: '^[✀-➿] \w+ for \d+(?:m \d+)?s'
  approval_prompt: '^ ❯ \d+\. '
claude-sonnet: *claude
