schema: forge-idle-prompts/2
classifier_version: 2
# `supported.codex_versions` is an ADVISORY record of reviewed versions — NOT a gate.
# The stall-check classifier admits a codex pane on the measured containment verdict its
# launch stamped on the pane (@forge-codex-admission); it does not consult this list, and
# gating on it made every upstream release a silent classifier outage (issue #39). Mirrors
# the containment-first policy comment in bin/forge's codex doctor.
# Do NOT delete these keys: bin/forge-stall-install-regex asserts `supported.codex_versions`
# and `supported.locales` non-empty and aborts before installing this file if either is gone.
supported:
  codex_versions: ["0.145.0", "0.146.0", "0.146.1", "0.147.0", "0.148.0", "0.149.1"]
  locales: ["en-US"]
codex-a: &codex
  family: codex
  idle_prompt_anchor: '^\s{2}gpt-[0-9][\w.\-]*(?:\s+\w+(?:\s+fast)?)?\s+·\s+(?:\S.*?)?(?:\s+·\s+\S.*)?$'
  active_work_marker: '^•\s+Working\s+\(\d+'
  past_work_marker: '^─\s+Worked\s+for\s+\d+'
  approval_prompt: '(?ms)^(?:⚠\s+)?(?:Would you like to run the following command\?|Do you want to allow .+?)\s*$[\s\S]{0,1200}?^\s*[›❯>]?\s*1\.\s+(?:Yes|Allow|Run)(?:,|\s|$)'
codex-b: *codex
claude-opus: &claude
  family: claude
  idle_prompt_anchor: '^  \[(?:Opus|Sonnet|Haiku|Fable) [0-9.]+(?: \(1M context\))?\] ctx: \d+k? \(\d+%\)'
  active_work_marker: '^[✀-➿] \w+… \(\d+s'
  past_work_marker: '^[✀-➿] \w+ for \d+(?:m \d+)?s'
  approval_prompt: '^ ❯ \d+\. '
claude-sonnet: *claude
